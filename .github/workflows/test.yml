name: tester

on:
  pull_request:
  push:
    branches:
      - "*"

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install ImageMagick and libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick libvips-dev ffmpeg
      - name: Build QOA reference converter
        run: |
          mkdir -p "$RUNNER_TEMP/qoa-tool"
          cd "$RUNNER_TEMP/qoa-tool"
          curl -fsSLO https://raw.githubusercontent.com/phoboslab/qoa/bc0589710ff6aa2f50e08fb4d0a815d567bc0f3e/qoa.h
          curl -fsSLO https://raw.githubusercontent.com/phoboslab/qoa/bc0589710ff6aa2f50e08fb4d0a815d567bc0f3e/qoaconv.c
          cc qoaconv.c -std=gnu99 -O3 -lm -o qoaconv
          echo "$RUNNER_TEMP/qoa-tool" >> "$GITHUB_PATH"
      - name: Run tests
        run: |
          go vet ./...
          go test -race -v ./... -coverprofile=coverage
          go tool cover -html=coverage -o coverage.html
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-Linux
          path: coverage.html

  test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install ImageMagick
        run: |
          choco install -y imagemagick ffmpeg
      - name: Run tests
        run: |
          go vet ./...
          go test -race -v ./... -coverprofile=coverage
          go tool cover -html=coverage -o coverage.html
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-Windows
          path: coverage.html

  test-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install ImageMagick and libvips
        run: |
          brew install imagemagick vips ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: Run tests
        run: |
          go vet ./...
          go test -race -v ./... -coverprofile=coverage
          go tool cover -html=coverage -o coverage.html
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-macOS
          path: coverage.html
